<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Visualizar em 3D</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="stylesheet" href="css/style.css">

  <!-- model-viewer: componente gratuito do Google que mostra o 3D na página
       e abre a realidade aumentada nativa do celular (iPhone e Android). -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
</head>
<body>

  <header class="topo">
    <h1 id="titulo">Carregando…</h1>
    <p id="subtitulo" class="sub">Gire com o dedo para ver todos os lados</p>
  </header>

  <main class="palco">
    <!-- O "src" é preenchido pelo js/app.js de acordo com o endereço (?m=nome) -->
    <model-viewer
      id="visor"
      alt="Modelo 3D do produto"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      auto-rotate-delay="1500"
      rotation-per-second="20deg"
      shadow-intensity="1"
      shadow-softness="0.8"
      exposure="1"
      environment-image="neutral"
      interaction-prompt="auto">

      <!-- Barra de carregamento -->
      <div slot="progress-bar" class="progresso" id="progresso">
        <div class="progresso-barra" id="progresso-barra"></div>
      </div>

      <!-- Botão de realidade aumentada (só aparece em celular compatível) -->
      <button slot="ar-button" class="botao-ar" id="botao-ar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.6 3.7L12 11.7 5.4 8 12 4.3ZM5 9.7l6 3.4v6.6l-6-3.4V9.7Zm8 10v-6.6l6-3.4v6.6l-6 3.4Z"/>
        </svg>
        Ver na minha mesa
      </button>
    </model-viewer>

    <!-- Mensagem de erro (arquivo não encontrado, etc.) -->
    <div id="erro" class="aviso aviso-erro" hidden>
      <p id="erro-texto"></p>
      <a id="link-demo" class="botao-sec" href="?demo=1">Ver um modelo de exemplo</a>
    </div>
  </main>

  <footer class="rodape">
    <p id="aviso-pc" class="aviso" hidden>
      A realidade aumentada abre no <strong>celular</strong>.
      <a href="qr.html" id="link-qr">Gerar QR Code desta página</a>
    </p>
    <p id="aviso-sem-ar" class="aviso" hidden>
      Este aparelho não suporta realidade aumentada. Você ainda pode girar o modelo em 3D.
    </p>
    <p id="info" class="info"></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
